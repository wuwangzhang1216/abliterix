name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev --no-extra vllm
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev --no-extra vllm
      - run: uv run ty check src/abliterix/

  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: test (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --group dev --no-extra vllm --python ${{ matrix.python-version }}
      - run: uv run pytest tests/ -x --cov=abliterix --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.13'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  ui:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      GRADIO_ANALYTICS_ENABLED: "False"
    strategy:
      matrix:
        gradio: ["5.50.0", "6.19.0"]
    name: ui (Gradio ${{ matrix.gradio }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --group dev --extra ui --no-extra vllm
      - run: uv run --locked --extra ui --with "gradio==${{ matrix.gradio }}" --with "huggingface-hub~=1.6" pytest tests/test_webui.py -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
      - run: test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

  reproducibility-e2e:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync --group dev --no-extra vllm --python 3.13
      - run: uv run python tests/e2e/verify_tiny_reproduction.py
